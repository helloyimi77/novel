name: Update PV data

on:
  # Scheduled collection paused: KASASAGI non-API access is prohibited.
  workflow_dispatch: {}

concurrency:
  group: update-pv-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run scraper
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "pv-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          pushed=false
          if ! git diff --quiet -- data.js scripts/naro_episode_cache.json scripts/naro_daily_pv_cache.json scripts/kakuyomu_stats_cache.json scripts/kakuyomu_daily_cache.json scripts/stats_history.json scripts/rankings_auto.json; then
            git add data.js scripts/naro_episode_cache.json scripts/naro_daily_pv_cache.json scripts/kakuyomu_stats_cache.json scripts/kakuyomu_daily_cache.json scripts/stats_history.json scripts/rankings_auto.json
            git commit -m "chore: auto-update PV data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 手動pushとの競合を避けるため、pushする前に最新を取り込んでリベース。
            # 最大3回まで再試行する（うまくいかない時は次回の実行に任せる）。
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { pushed=true; break; }
              echo "push retry $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != true ]; then exit 1; fi
          else
            echo "No changes in data.js / caches"
          fi
