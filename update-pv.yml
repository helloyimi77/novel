name: Update PV data

on:
  schedule:
    # UTC基準。JSTでだいたい 8:00 / 13:00 / 21:00 頃に実行（1日3回）
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "pv-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.js; then
            git add data.js
            git commit -m "chore: auto-update PV data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in data.js"
          fi
