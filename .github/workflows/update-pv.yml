name: Update PV data

on:
  schedule:
    # 30分おきに実行（UTC基準・cronは分単位の粒度が最小のため */30 で30分間隔を表現）
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "pv-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.js scripts/naro_episode_cache.json scripts/naro_daily_pv_cache.json; then
            git add data.js scripts/naro_episode_cache.json scripts/naro_daily_pv_cache.json
            git commit -m "chore: auto-update PV data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in data.js / caches"
          fi
