name: Update PV data

on:
  # Scheduled collection paused: KASASAGI non-API access is prohibited.
  workflow_dispatch: {}

concurrency:
  group: update-pv-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Report paused collection
        run: |
          echo "PV collection is paused. Existing data and caches are unchanged."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## PVデータの自動取得は停止中です

          取得処理とデータの書き換えをスキップしました。
          既存の data.js・更新日時・全キャッシュを保持しています。
          回帰テストが成功した場合、この実行は正常終了します。
          EOF
